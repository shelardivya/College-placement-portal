name: Develop Branch SonarQube Analysis

on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - "frontend/**"

permissions:
  contents: read

concurrency:
  group: develop-sonar
  cancel-in-progress: true

jobs:
  backend-sonar:
    name: Backend Develop Sonar Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build Backend
        working-directory: backend
        run: mvn --batch-mode clean package -DskipTests

      - name: SonarQube Backend Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend-sonar:
    name: Frontend Develop Sonar Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, Test and Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
          npm run build

      - name: SonarQube Frontend Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
