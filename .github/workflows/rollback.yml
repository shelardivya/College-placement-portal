name: Emergency Rollback to Main

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Safe branch to restore (default: main)'
        required: true
        default: 'main'

jobs:
  rollback:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Rebuild & Restore Backend
        run: |
          mvn clean package -DskipTests
          sudo cp target/portal-0.0.1-SNAPSHOT.jar /opt/backend_app/College-placement-portal/backend/target/
          sudo chown backend_user:backend_user /opt/backend_app/College-placement-portal/backend/target/portal-0.0.1-SNAPSHOT.jar
          sudo systemctl restart backend.service
        working-directory: backend

      - name: Rebuild & Restore Frontend
        run: |
          npm ci
          npm run build
          sudo rsync -a --delete dist/ /opt/frontend_app/frontend/dist/
          sudo chown -R frontend_user:frontend_user /opt/frontend_app/frontend/dist/
        working-directory: frontend
